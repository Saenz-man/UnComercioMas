# Nombre del Workflow
name: Desplegar API en VPS

# ---- ¡EL DISPARADOR! ----
# Se activa solo cuando haces "push" a la rama "Mark-ProduccionApi"
on:
  push:
    branches:
      - Mark-ProduccionApi

# Tareas a ejecutar
jobs:
  desplegar:
    # Usar la última versión de Ubuntu como "robot"
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Configurar la llave SSH para poder acceder al VPS
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      # Paso 2: Ejecutar los comandos de despliegue en el VPS
      - name: Desplegar en VPS
        run: |
          # Añadir la IP del VPS a la lista de "hosts conocidos" (para evitar preguntas)
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          # Ejecutar los comandos en el VPS
          # (Nota el "EOF" al inicio y al final)
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            
            echo "✅ 1. Conectado al VPS..."
            
            # 1. Ir a la carpeta raíz del proyecto clonado
            cd /var/www/uncomerciomas-api
            
            echo "✅ 2. Asegurando la rama correcta..."
            # 2. Asegurarse de estar en la rama correcta (¡IMPORTANTE!)
            # (git fetch trae la info de la nueva rama si no existe localmente)
            git fetch origin
            git checkout Mark-ProduccionApi
            
            echo "✅ 3. Trayendo últimos cambios..."
            # 3. Traer los últimos cambios de esa rama
            git pull origin Mark-ProduccionApi
            
            echo "✅ 4. Entrando a la carpeta de la API..."
            # 4. Entrar a la carpeta de la API
            cd UnComercioMas-Api
            
            echo "✅ 5. Instalando dependencias..."
            # 5. Instalar nuevas dependencias (si las hay)
            npm install --only=production
            
            echo "✅ 6. Compilando API..."
            # 6. Compilar el código de TypeScript a JavaScript
            npm run build
            
            echo "✅ 7. Recargando API en PM2..."
            # 7. Recargar la API en PM2 (¡Sin caídas!)
            pm2 reload uc+-api
            
            echo "🚀 ¡Despliegue completado!"
            
          EOF
