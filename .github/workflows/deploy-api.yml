name: 🚀 Despliegue de API a VPS (Producción)

on:
  push:
    branches:
      - Mark-ApiProduccion

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPN_HOST }} # Usando tu secreto VPN_HOST
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- FASE DE BUILD EN GITHUB (Rápida y Limpia) ---
      
      - name: 📦 Instalar TODAS las dependencias (para Build)
        # Necesitas devDependencies (TypeScript, Nest CLI) para compilar.
        run: npm install

      - name: 🏗️ Compilar la API
        # Esto crea la carpeta 'dist' con el código JavaScript final
        run: npm run build

      # --- FASE DE DEPLOY AL VPS ---

      - name: 📤 Desplegar archivos (SOLO lo necesario)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPN_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          # 🚨 TRANSFERIMOS SÓLO lo necesario:
          # dist: Código compilado
          # node_modules: Dependencias de producción
          # package.json/lock: Para la estructura
          # .env.production: Las credenciales del servidor
          SOURCE: "./dist ./node_modules ./package.json ./package-lock.json ./.env.production" 
          TARGET: "/var/www/uncomerciomas-api/"
          ARGS: "-rltgoDzv --delete"

      - name: 🚀 Ejecutar comandos en el VPS (Reiniciar PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPN_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/uncomerciomas-api/
            echo "Reiniciando API con PM2..."
            # Forzamos la recarga de PM2
            pm2 reload uc+-api || pm2 start dist/main.js --name "uc+-api"
            pm2 save
            echo "✅ Despliegue completado con éxito. ¡Revisar Swagger!"