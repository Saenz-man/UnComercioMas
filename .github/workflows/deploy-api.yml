name: 🚀 Despliegue de API a VPS (Producción)

on:
  push:
    branches:
      - Mark-ApiProduccion

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPN_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      # --- FASE DE DEPLOY AL VPS (Transferir Código Fuente) ---

      - name: 📤 Desplegar código fuente y archivos de control
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPN_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          # 🚨 Subimos el código fuente, package.json y .env.production
          SOURCE: "./src ./package.json ./package-lock.json ./.env.production ./tsconfig.json" 
          TARGET: "/var/www/uncomerciomas-api/"
          ARGS: "-rltgoDzv --delete" 
          
      # --- PASO CRÍTICO: BUILD, INSTALACIÓN Y REINICIO EN EL VPS ---

      - name: 🚀 Ejecutar comandos de Build y Reinicio en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPN_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/uncomerciomas-api/
            
            # 1. Forzar la carga de NVM/Node Path (NECESARIO para encontrar PM2)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            echo "Instalando dependencias de producción y compilando..."
            
            # 2. Instalación de dependencias de producción (en el VPS)
            npm install --only=production
            
            # 3. Compilación (npx es necesario en el VPS para encontrar Nest CLI)
            npx nest build
            
            echo "Reiniciando API con PM2..."
            # 4. Reinicio de PM2
            pm2 reload uc+-api || pm2 start dist/main.js --name "uc+-api"
            pm2 save
            echo "✅ Despliegue completado con éxito."