name: 🚀 Despliegue de API a VPS (Producción)

on:
  push:
    branches:
      - Mark-ApiProduccion

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPN_HOST }} # Usando tu secreto VPN_HOST
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- FASE DE BUILD EN GITHUB (Necesita acceso a devDependencies) ---
      
      - name: 📦 Instalar TODAS las dependencias (para Build)
        # Necesitamos todas las dependencias para que el compilador de NestJS funcione.
        run: npm install

      - name: 🏗️ Compilar la API
        # Esto crea la carpeta 'dist' con el código JavaScript final
        run: npm run build

      # --- FASE DE DEPLOY AL VPS (Transferir Build) ---

      - name: 📤 Desplegar archivos (SOLO lo necesario)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPN_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          # 🚨 TRANSFERIMOS SÓLO: Código compilado, dependencias de producción, y credenciales.
          SOURCE: "./dist ./node_modules ./package.json ./package-lock.json ./.env.production" 
          TARGET: "/var/www/uncomerciomas-api/"
          ARGS: "-rltgoDzv --delete"

      - name: 🚀 Ejecutar comandos en el VPS (Reiniciar PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPN_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/uncomerciomas-api/
            
            # --- REINICIO CRÍTICO (Usando la ruta absoluta) ---
            # 💡 La ruta de PM2 que encontraste: /root/.nvm/versions/node/v24.11.0/bin/pm2
            # Ajustamos la versión de Node por si cambia
            PM2_BIN=$(find /root/.nvm/versions/node/ -name pm2 -type f -print -quit)
            
            echo "Reiniciando API con PM2..."
            
            # Ejecutamos el binario PM2 usando la ruta encontrada
            $PM2_BIN reload uc+-api || $PM2_BIN start dist/main.js --name "uc+-api"
            $PM2_BIN save
            echo "✅ Despliegue completado con éxito. ¡Revisar Swagger!"