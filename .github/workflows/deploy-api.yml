name: 🚀 Despliegue de API a VPS (Producción)

on:
  push:
    branches:
      - Mark-ApiProduccion

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPN_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- DEPLOY AL VPS ---
      - name: 📤 Subir código al VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPN_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          SOURCE: "./*"
          TARGET: "/var/www/uncomerciomas-api/"
          ARGS: "-rltgoDzv --delete --exclude node_modules --exclude dist"

      - name: 🚀 Instalar dependencias y arrancar API con PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPN_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/uncomerciomas-api/

            echo "📦 Instalando dependencias..."
            npm install --production

            echo "🏗️ Compilando TypeScript..."
            npm run build

            echo "🔍 Buscando binario de PM2..."
            PM2_BIN=$(find /root/.nvm/versions/node/ -name pm2 -type f -print -quit)
            echo "✅ PM2 encontrado en: $PM2_BIN"

            echo "🚀 Reiniciando API en modo producción..."
            NODE_ENV=production $PM2_BIN delete "uc+-api" || true
            NODE_ENV=production $PM2_BIN start dist/main.js --name "uc+-api" --env production

            echo "💾 Guardando configuración de PM2..."
            $PM2_BIN save

            echo "🧠 Estado del proceso:"
            $PM2_BIN status uc+-api || echo "⚠️ No se encontró el proceso uc+-api."

            echo "📜 Últimos logs del proceso (30 líneas):"
            $PM2_BIN logs uc+-api --lines 30

            echo "✅ Despliegue completado."
            echo "🌐 Revisa Swagger en: https://api-uncomerciomas.undesarrollomas.com/api/docs"
